<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#011e41">
  <meta name="robots" content="noindex">
  <title>ISI STEEL · តាមដានការដឹកជញ្ជូន</title>
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Customer live tracking (Kim, 22 Nov 2026): no sign-in. Shows only this DN: steps, truck on a free OpenStreetMap map, ETA, driver name and phone (no kg). -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root { --bg: #f3f6fa; --card: #fff; --text: #011e41; --muted: #546274; --line: #d6dee8; --brand: #084f6a; --accent: #0b76a0; --soft: #d4e1f5; --star: #f2a900; --bad: #b3261e; --ok: #1e7b46; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #06111f; --card: #0d1e32; --text: #e6eef7; --muted: #9cb0c6; --line: #213852; --brand: #61cbf4; --accent: #61cbf4; --soft: #112d48; --bad: #f28b82; --ok: #5cc98a; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 "Noto Sans Khmer", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px; padding-top: env(safe-area-inset-top); min-height: 54px; color: #fff;
      background: #091f3f url(../icons/banner-pattern.png) left center / auto 120px repeat-x; }
    .logo { display: flex; align-items: center; gap: 8px; font: 800 17px/1 system-ui, sans-serif; letter-spacing: .5px; }
    .logo img { border-radius: 50%; }
    .lang { display: inline-flex; gap: 3px; padding: 4px 5px; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; background: transparent; cursor: pointer; }
    .lang img { width: 17px; height: 12px; border-radius: 2px; opacity: .4; filter: grayscale(.7); }
    .lang img.on { opacity: 1; filter: none; box-shadow: 0 0 0 1.5px #fff; }
    main { max-width: 480px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    h1 { font-size: 19px; margin: 0 0 4px; }
    .muted { color: var(--muted); font-size: 14px; }
    .btn { width: 100%; min-height: 50px; margin-top: 14px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
    .btn:disabled { opacity: .55; }
    .msg { padding: 10px 14px; border-radius: 12px; font-weight: 600; }
    .bad { background: rgba(179,38,30,.1); color: var(--bad); }
    .ok { background: rgba(30,123,70,.12); color: var(--ok); text-align: center; font-size: 18px; padding: 24px 14px; }
    [hidden] { display: none !important; }
  
    /* Kim picked layout C (24 Nov 2026): orange status bar, two big numbers, map, 4-step bar, driver card with 2 buttons */
    :root { --orange: #c2410c; --orangebg: #fff1e6; --okbg: #e7f7ec; --sky: #61cbf4; }
    @media (prefers-color-scheme: dark) { :root { --orange: #fb923c; --orangebg: #3a2410; --okbg: #0f2e1c; } }
    .status { border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; background: var(--card); border: 2px solid var(--line); }
    .status h1 { font-size: 18px; margin: 0 0 2px; }
    .status.go { background: var(--orangebg); border-color: var(--orange); } .status.go h1 { color: var(--orange); }
    .status.done { background: var(--okbg); border-color: var(--ok); } .status.done h1 { color: var(--ok); }
    .dots { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: bounce 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
    .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .nums > div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
    .nums b { display: block; font-size: 28px; font-weight: 800; line-height: 1.15; }
    .nums small { display: block; color: var(--muted); font-size: 12.5px; }
    #map { height: 240px; border-radius: 12px; z-index: 0; }
    .mapcard { padding: 8px; }
    .live { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 800; background: rgba(30,123,70,.12); color: var(--ok); }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: p 1.4s infinite; }
    .live.old { background: rgba(84,98,116,.12); color: var(--muted); } .live.old i { background: var(--muted); animation: none; }
    @keyframes p { 50% { opacity: .3; } }
    .hstep { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); list-style: none; margin: 0; padding: 0; }
    .hstep:before { content: ""; position: absolute; top: 17px; left: 12.5%; right: 12.5%; height: 4px; background: var(--line); border-radius: 4px; }
    .hstep .bar { position: absolute; top: 17px; left: 12.5%; height: 4px; background: var(--ok); border-radius: 4px; transition: width .4s; }
    .hstep li { position: relative; z-index: 1; display: grid; justify-items: center; gap: 3px; line-height: 1.3; }
    .hstep li > b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--line); font-size: 17px; }
    .hstep li.on { color: var(--text); } .hstep li.on > b { background: var(--ok); border-color: var(--ok); color: #fff; }
    .hstep li.now { color: var(--text); } .hstep li.now > b { border-color: var(--sky); animation: ring 1.6s infinite; }
    .hstep small { color: var(--muted); font-weight: 400; }
    @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(97,203,244,.6); } 70% { box-shadow: 0 0 0 9px rgba(97,203,244,0); } 100% { box-shadow: 0 0 0 0 rgba(97,203,244,0); } }
    .drv { display: flex; align-items: center; gap: 10px; }
    .av { width: 44px; height: 44px; border-radius: 50%; background: #011e41; color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .btns.one { grid-template-columns: 1fr; }
    .call, .gbtn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 8px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px; white-space: nowrap; }
    .call { background: var(--ok); color: #fff; }
    .gbtn { border: 1.5px solid var(--line); color: var(--text); background: var(--card); }
    .stamp { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="logo"><img src="../icons/isi-white.png" alt="ISI" width="30" height="30">STEEL</div>
    <button type="button" class="lang" id="lang" aria-label="English / ខ្មែរ"><img src="../icons/flag-kh.svg" alt="ខ្មែរ" id="fkh"><img src="../icons/flag-gb.svg" alt="English" id="fen"></button>
  </header>
  <main>
    <div id="err" class="msg bad" hidden></div>
    <div id="load" class="muted" data-t="កំពុងផ្ទុក…|Loading…"></div>
    <div id="view" hidden>
      <div class="status" id="status">
        <h1><span id="title"></span><span class="dots" id="dots" hidden><i></i><i></i><i></i></span></h1>
        <div class="muted" id="info"></div>
      </div>
      <div class="nums" id="nums" hidden>
        <div><small data-t="⏱️ នៅសល់ពេល|⏱️ Time left"></small><b id="left">—</b><small id="eta"></small></div>
        <div><small data-t="📍 នៅសល់ចម្ងាយ|📍 Distance left"></small><b id="dist">—</b><small><span class="live" id="live"><i></i><span id="livet"></span></span> <span id="upd"></span></small></div>
      </div>
      <div id="mapcard" class="card mapcard" hidden><div id="map"></div></div>
      <div id="nogps" class="card muted" hidden data-t="📍 ទីតាំងឡាននឹងបង្ហាញនៅពេលតៃកុងចាប់ផ្តើមចែករំលែក។|📍 The truck location shows once the driver starts sharing it."></div>
      <div id="donecard" class="card msg ok" hidden></div>
      <div class="card"><ol class="hstep" id="steps"></ol></div>
      <div id="drv" class="card" hidden>
        <div class="drv"><div class="av">🚛</div><div style="min-width:0"><b id="plate"></b><div class="muted"><span id="drvlbl"></span> <span id="drvname"></span></div></div></div>
        <div class="btns" id="btns">
          <a id="drvtel" class="call" hidden></a>
          <a class="gbtn" id="gmap" target="_blank" rel="noopener" hidden>🗺️ Google Maps</a>
        </div>
      </div>
      <a id="rate" class="btn" style="display:block;text-align:center;text-decoration:none;line-height:50px" hidden data-t="⭐ វាយតម្លៃការដឹកជញ្ជូន|⭐ Rate this delivery"></a>
      <div class="stamp" id="stamp"></div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
  (function () {
    var lang = 'km';
    try { if (localStorage.getItem('app_lang') === 'en') lang = 'en'; } catch (e) {}
    var T = function (s) { var p = String(s).split('|'); return lang === 'en' ? p[1] || p[0] : p[0]; };
    var $ = function (id) { return document.getElementById(id); };
    var info = null, map = null, truck = null, site = null, line = null, fitted = false, fitted2 = false;
    var hm = function (ms) { return ms ? new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Phnom_Penh' }) : ''; };
    var ll = function (s) { var p = String(s || '').split(','); var a = Number(p[0]), b = Number(p[1]); return isFinite(a) && isFinite(b) && p.length === 2 ? [a, b] : null; };
    function km(a, b) { var R = 6371, r = Math.PI / 180, x = (b[0] - a[0]) * r, y = (b[1] - a[1]) * r; var h = Math.sin(x / 2) * Math.sin(x / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(y / 2) * Math.sin(y / 2); return 2 * R * Math.asin(Math.sqrt(h)); }
    function paint() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T(el.getAttribute('data-t')); });
      $('fkh').className = lang === 'km' ? 'on' : ''; $('fen').className = lang === 'en' ? 'on' : '';
      if (info) render();
    }
    $('lang').onclick = function () { lang = lang === 'en' ? 'km' : 'en'; try { localStorage.setItem('app_lang', lang); } catch (e) {} paint(); };
    var q = new URLSearchParams(location.search);
    var link = { d: q.get('d') || '', t: q.get('t') || '', k: q.get('k') || '' };
    var url = (window.DELIVERY_CONFIG || {}).API_URL;
    function call(action, payload) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: payload }) })
        .then(function (r) { return r.json(); })
        .then(function (r) { if (!r.ok) { var m = String(r.error || '').replace(/^[A-Z_]+:\s*/, '').split(' || '); var e = new Error(lang === 'en' ? m[0] : m[1] || m[0]); e.code = String(r.error || '').split(':')[0]; throw e; } return r.data; });
    }
    // Live road route on this page (Kim, 24 Nov 2026), free OSRM public router, no key. Asked again only when the truck
    // moved more than 150 m or after 3 minutes; any error keeps the straight dashed line.
    var road = null, roadAsk = null;
    function getRoad(pos, dest) {
      var now = Date.now();
      if (roadAsk && (roadAsk.busy || (km(roadAsk.pos, pos) < 0.15 && now - roadAsk.at < 180000))) return;
      roadAsk = { pos: pos, at: now, busy: true };
      var u = 'https://router.project-osrm.org/route/v1/driving/' + pos[1] + ',' + pos[0] + ';' + dest[1] + ',' + dest[0] + '?overview=full&geometries=geojson';
      fetch(u).then(function (x) { return x.json(); }).then(function (j) {
        var rt = j && j.routes && j.routes[0];
        if (!rt) return;
        road = { km: rt.distance / 1000, min: rt.duration / 60, path: rt.geometry.coordinates.map(function (c) { return [c[1], c[0]]; }) };
        if (info) render();
      }).catch(function () {}).then(function () { roadAsk.busy = false; });
    }
    function render() {
      var r = info, x = r.times, leg = r.leg;
      var finished = leg === 'delivered' || leg === 'failed' || leg === 'canceled' || leg === 'moved';
      $('title').textContent = finished ? (leg === 'delivered' ? T('✅ បានប្រគល់រួចរាល់|✅ Delivered') : leg === 'failed' ? T('⚠️ ប្រគល់មិនបាន|⚠️ Not delivered') : T('ការដឹកនេះត្រូវបានបញ្ចប់|This delivery was closed'))
        : x.arrived ? T('📍 ឡានមកដល់ទីតាំងរបស់អ្នកហើយ|📍 The truck is at your site') : x.out ? T('🚚 ទំនិញរបស់អ្នកកំពុងនៅតាមផ្លូវ|🚚 Your steel is on the way') : T('🏭 កំពុងរៀបចំនៅរោងចក្រ|🏭 Being prepared at the plant');
      $('status').className = 'status' + (leg === 'delivered' ? ' done' : !finished && x.out ? ' go' : '');
      $('dots').hidden = finished || !x.out;
      $('info').textContent = [r.cust, 'DN ' + r.dn, r.so ? 'SO ' + r.so : ''].filter(Boolean).join(' · ');
      $('plate').textContent = r.plate || '';   // no kg (Kim, 22 Nov 2026)
      var dv = r.driver || {};
      // Kim (24 Nov 2026): the call button always shows once the truck left (driver phone, else the office line).
      $('drv').hidden = finished || !x.out || !(dv.name || dv.phone);
      $('drvname').textContent = dv.name || T('អាយ អេស អាយ ស្ទីល|ISI Steel');
      $('drvlbl').textContent = dv.office ? T('ទូរស័ព្ទការិយាល័យ|Office phone') : T('តៃកុង|Driver');
      $('drvtel').hidden = !dv.phone;
      if (dv.phone) { $('drvtel').href = 'tel:' + String(dv.phone).replace(/[^0-9+]/g, ''); $('drvtel').textContent = '📞 ' + (dv.office ? T('ហៅការិយាល័យ|Call office') : T('ហៅតៃកុង|Call driver')); $('drvtel').title = dv.phone; }
      var steps = [
        ['🏭', T('ចេញពីរោងចក្រ|Left the plant'), x.out],
        ['🚚', T('នៅតាមផ្លូវ|On the way'), x.arrived && x.out],   // done once it arrived; pulses while on the road
        ['📍', T('មកដល់|Arrived'), x.arrived],
        [leg === 'failed' || leg === 'canceled' ? '⚠️' : '✅', leg === 'failed' ? T('ប្រគល់មិនបាន|Not delivered') : leg === 'canceled' ? T('បានលុបចោល|Canceled') : T('បានប្រគល់|Delivered'), x.delivered || x.failed || x.canceled],
      ];
      // done steps get a green tick; the first step not done yet (once the truck left) pulses
      var nDone = 0; while (nDone < 4 && steps[nDone][2]) nDone++;
      if (finished && steps[3][2]) nDone = 4;
      $('steps').innerHTML = '<span class="bar" style="width:' + (Math.max(0, nDone - 1) * 25) + '%"></span>';
      steps.forEach(function (s, i) {
        var li = document.createElement('li'), done = i < nDone, now = !done && !finished && x.out && i === nDone;
        li.className = done ? 'on' : now ? 'now' : '';
        li.innerHTML = '<b></b><span></span><small></small>';
        li.firstChild.textContent = done ? '✓' : s[0]; li.children[1].textContent = s[1];
        li.lastChild.textContent = done && s[2] && i !== 1 ? hm(s[2]) : '';
        $('steps').appendChild(li);
      });
      var g = r.gps, pos = g && ll(g.ll), dest = ll(r.site);
      $('mapcard').hidden = $('nums').hidden = $('gmap').hidden = finished || !pos; $('nogps').hidden = finished || !x.out || !!pos;
      $('btns').className = 'btns' + ($('gmap').hidden || $('drvtel').hidden ? ' one' : '');
      if (pos && !finished) {
        var age = Math.max(0, Math.round((r.serverNow - g.t) / 60000));
        $('live').className = 'live' + (age > 10 ? ' old' : '');
        $('livet').textContent = age > 10 ? T('ឃើញចុងក្រោយ ' + hm(g.t) + '|Last seen ' + hm(g.t)) : 'LIVE';
        // Kim (24 Nov 2026): Google Maps opens the driving route from the truck to the site (Google shows its own arrival time).
        $('gmap').href = dest ? 'https://www.google.com/maps/dir/?api=1&origin=' + pos[0] + ',' + pos[1] + '&destination=' + dest[0] + ',' + dest[1] + '&travelmode=driving'
          : 'https://www.google.com/maps/search/?api=1&query=' + pos[0] + ',' + pos[1];
        if (dest) {
          getRoad(pos, dest);
          var d = road && road.km != null ? road.km : km(pos, dest) * 1.3;   // road distance (free OSRM route), else about 1.3 x the straight line
          $('dist').textContent = Math.round(d) + ' km';
          $('upd').textContent = hm(g.t);
          // Route time for a car x 1.3 for a loaded truck; no route yet: about 35 km/h.
          var ms = road && road.min != null ? road.min * 1.3 * 60000 : d / 35 * 3600000, mins = Math.round(ms / 60000);
          $('left').style.fontSize = '';
          $('left').textContent = d < 0.5 ? T('ជិតដល់|Arriving') : String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
          $('eta').textContent = d < 0.5 ? '' : T('មកដល់ ~' + hm(r.serverNow + ms) + '|Arrives ~' + hm(r.serverNow + ms));
        } else {
          // No site location saved for this customer: no arrival time can be worked out (it fills after the first delivery).
          $('left').style.fontSize = '15px';
          $('left').textContent = T('មិនទាន់មានទីតាំងអតិថិជន|No site location yet');
          $('eta').textContent = ''; $('dist').textContent = '—'; $('upd').textContent = hm(g.t);
        }
        if (window.L) {
          if (!map) {
            map = L.map('map', { zoomControl: true, attributionControl: true });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
          }
          var icon = L.divIcon({ className: '', html: '<div style="font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px #0005)">🚚</div>', iconSize: [32, 32], iconAnchor: [16, 16] });
          if (!truck) truck = L.marker(pos, { icon: icon }).addTo(map); else truck.setLatLng(pos);
          if (dest && !site) site = L.marker(dest, { icon: L.divIcon({ className: '', html: '<div style="font-size:28px;line-height:1">📍</div>', iconSize: [28, 28], iconAnchor: [14, 26] }) }).addTo(map);
          if (dest) {
            var path = road && road.path ? road.path : [pos, dest];
            if (line) line.setLatLngs(path); else line = L.polyline(path, { color: '#0b76a0', weight: 5, opacity: 0.85 }).addTo(map);
            line.setStyle({ dashArray: road && road.path ? null : '4 8', weight: road && road.path ? 5 : 3 });
          }
          if (!fitted || (road && road.path && !fitted2)) { if (road && road.path) fitted2 = true; fitted = true; if (dest) map.fitBounds(road && road.path ? line.getBounds() : [pos, dest], { padding: [40, 40], maxZoom: 15 }); else map.setView(pos, 14); }
          setTimeout(function () { map.invalidateSize(); }, 50);
        }
      }
      $('donecard').hidden = leg !== 'delivered' || !r.proof;
      if (r.proof) $('donecard').textContent = T('អ្នកទទួល|Received by') + ': ' + (r.proof.receiver || '—') + (r.proof.signed ? ' · ✍️' : '') + (r.proof.photos ? ' · 📷 ' + r.proof.photos : '');
      $('rate').hidden = !r.rateKey;
      if (r.rateKey) $('rate').href = 'rate.html?d=' + encodeURIComponent(r.dn) + '&t=' + encodeURIComponent(r.tripId) + '&k=' + r.rateKey;
      $('stamp').textContent = finished ? '' : T('ធ្វើបច្ចុប្បន្នភាពរៀងរាល់ 30 វិនាទី|Refreshes every 30 seconds');
    }
    function fail(e) { $('err').textContent = e && e.message && e.code ? e.message : T('មិនអាចភ្ជាប់អ៊ីនធឺណិត។ សូមព្យាយាមម្តងទៀត។|No connection. Please try again.'); $('err').hidden = false; }
    function load() {
      return call('trackInfo', link).then(function (r) { info = r; $('err').hidden = true; $('load').hidden = true; $('view').hidden = false; render(); return r; })
        .catch(function (e) { $('load').hidden = true; if (!info) fail(e); });
    }
    paint();
    if (!url || !link.d || !link.k) { $('load').hidden = true; fail({ code: 'LINK', message: T('តំណនេះមិនត្រឹមត្រូវ។|This link is not valid.') }); return; }
    load();
    setInterval(function () {
      if (document.hidden || !info) return;
      var l = info.leg; if (l === 'delivered' || l === 'failed' || l === 'canceled' || l === 'moved') return;
      load();
    }, 30000);
  })();
  </script>
</body>
</html>
