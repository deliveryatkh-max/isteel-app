<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#011e41">
  <meta name="robots" content="noindex">
  <title>អនុម័ត · Approve</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Noto Sans Khmer', system-ui, sans-serif; background: #eef2f7; color: #1d2939; }
    header { background: #011e41; color: #fff; padding: 14px 16px; font-weight: 700; }
    main { max-width: 460px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 16px; padding: 22px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.08); text-align: center; }
    .big { font-size: 56px; line-height: 1.1; }
    h1 { font-size: 20px; margin: 10px 0 6px; }
    p { color: #475467; margin: 6px 0; }
    .ok h1 { color: #067647; } .no h1 { color: #b42318; } .err h1 { color: #b42318; }
    .spin { width: 36px; height: 36px; border: 4px solid #d0d5dd; border-top-color: #0b4f6c; border-radius: 50%; animation: s 1s linear infinite; margin: 10px auto; }
    @keyframes s { to { transform: rotate(360deg); } }
    a { color: #0b4f6c; }
  </style>
</head>
<body>
  <header>⚖️ ISI STEEL · ជញ្ជីងឡាន</header>
  <main><div class="card" id="box"><div class="spin"></div><p>កំពុងរក្សាទុក… · Saving…</p></div></main>
  <script src="config.js?v=20261106b"></script>
  <script>
    // Telegram ✅ Approve / ❌ Reject for a missed 1st weigh (Kim, 28 Nov 2026). The link is signed; no sign-in needed.
    (async function () {
      var q = new URLSearchParams(location.search), box = document.getElementById('box');
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
      var no = q.get('no') || '', a = q.get('a') === 'ok' ? 'ok' : 'no';
      try {
        var res = await fetch((window.SC_CONFIG || {}).API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'scTgDecide', payload: { no: no, a: a, c: q.get('c') || '', k: q.get('k') || '' } }) });
        var d = await res.json();
        if (!d.ok) throw new Error(String(d.error || '').replace(/^[A-Z_]+:\s*/, '').split(' || ').reverse().join(' · '));
        var r = d.data;
        box.className = 'card ' + (r.appr === 'Approved' ? 'ok' : 'no');
        box.innerHTML = '<div class="big">' + (r.appr === 'Approved' ? '✅' : '❌') + '</div><h1>' + (r.appr === 'Approved' ? 'បានអនុម័ត · Approved' : 'បានបដិសេធ · Rejected') + '</h1>'
          + '<p><b>' + esc(r.no) + '</b>' + (r.plate ? ' · ' + esc(r.plate) : '') + '</p><p>' + esc(r.by || '') + '</p>'
          + (r.same ? '<p>(រួចហើយ · already saved)</p>' : '') + '<p><a href="./#/t/' + encodeURIComponent(r.no) + '">បើកប័ណ្ណ · Open the ticket</a></p>';
      } catch (e) {
        box.className = 'card err';
        box.innerHTML = '<div class="big">⚠️</div><h1>មិនអាចរក្សាទុក · Not saved</h1><p>' + esc(e.message) + '</p>';
      }
    })();
  </script>
</body>
</html>
