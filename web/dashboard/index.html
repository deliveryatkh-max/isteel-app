<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#011e41">
  <title>Fuel Dashboard</title>
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@800&text=STEEL&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ISI STEEL banner: navy chevron pattern with the white ISI circle and STEEL */
    header.bg-head { background: #091f3f url(../icons/banner-pattern.png) left center / auto 120px repeat-x; }
    .isi-logo { display: flex; align-items: center; gap: 8px; flex: none; }
    .isi-logo img { display: block; border-radius: 50%; }
    .isi-logo .word { font: 800 17px/1 "Noto Sans", "Noto Sans Khmer", system-ui, sans-serif; letter-spacing: .5px; color: #fff; }
    .isi-sep { width: 1px; height: 28px; background: rgba(255,255,255,.3); flex: none; }
    header.bg-head .btn-sm { height: 28px; min-height: 28px; padding: 0 8px; font-size: 13px; }
    /* Same header height and day/night button as the other apps (Kim, 2026-10-11). */
    header.bg-head > div { height: 54px; }
    header.bg-head .btn-sm[aria-label] { width: 30px; padding: 0; justify-content: center; border-radius: 8px; font-size: 14px; background: transparent; border-color: rgba(255,255,255,.25); }
    header.bg-head .btn-sm[aria-label]:hover { background: rgba(255,255,255,.1); }
  </style>
  <script>
    // Same theme choice as the Fuel Refill app; set before paint so there is no flash.
    (function () {
      var t = null; try { t = localStorage.getItem('fr_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = document.documentElement.getAttribute('data-theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <!-- API_URL and GOOGLE_CLIENT_ID come from the Fuel Refill app's own config.js (one folder up). -->
  <script src="../config.js"></script>
  <!-- Keeps the whole site on the phone so it opens at once, even offline (see ../sw.js). -->
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(function () {});</script>
  <!-- React, ReactDOM, PropTypes and Recharts are served from this site (vendor/), so no outside server can block them. -->
  <script defer src="./vendor/react.production.min.js"></script>
  <script defer src="./vendor/react-dom.production.min.js"></script>
  <script defer src="./vendor/prop-types.min.js"></script>
  <script defer src="./vendor/Recharts.js"></script>
  <script type="module" crossorigin src="./assets/dashboard.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/dashboard.css">
  <link rel="stylesheet" href="./glass.css?v=20261028a">
  <!-- Tapping the ISI STEEL logo refreshes the screen (Kim, 12 Oct 2026). -->
  <style>.isi-logo{cursor:pointer;-webkit-tap-highlight-color:transparent}</style>
  <script>document.addEventListener('click', function (e) { var l = e.target && e.target.closest && e.target.closest('.isi-logo'); if (!l) return; e.preventDefault(); if (window.ISTEEL_REFRESH) window.ISTEEL_REFRESH(); else location.reload(); });</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
