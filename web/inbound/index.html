<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#011e41">
  <title>ទទួលទំនិញ · Inbound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@800&text=STEEL&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link rel="apple-touch-icon" href="../icons/app-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../overtime/ot.css">
  <link rel="stylesheet" href="ib.css?v=20261028h">
  <script>try { var t = localStorage.getItem('fr_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <!-- Tapping the ISI STEEL logo refreshes the screen (Kim, 12 Oct 2026). -->
  <style>.isi-logo{cursor:pointer;-webkit-tap-highlight-color:transparent}</style>
  <script>document.addEventListener('click', function (e) { var l = e.target && e.target.closest && e.target.closest('.isi-logo'); if (!l) return; e.preventDefault(); if (window.ISTEEL_REFRESH) window.ISTEEL_REFRESH(); else location.reload(); });</script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <div class="isi-logo"><img src="../icons/isi-white.png" alt="ISI" width="30" height="30"><span class="word">STEEL</span></div>
      <span class="sep" aria-hidden="true"></span>
      <div><b data-km="ទទួលទំនិញ" data-en="Inbound">ទទួលទំនិញ</b><small data-km="កំណត់ត្រាទទួលទំនិញ" data-en="Goods receipt log">កំណត់ត្រាទទួលទំនិញ</small></div>
    </div>
    <div class="bar-right">
      <button type="button" class="icon-btn lang-btn" id="langBtn"></button>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Light / Dark" title="Light / Dark">🌙</button>
    </div>
  </header>
  <div id="demo" class="demo" hidden></div>

  <main id="view"><div class="loading" role="status" aria-label="Loading"><div class="lbar"><i></i></div><div class="skel"></div><div class="skel"></div><div class="skel short"></div></div></main>

  <nav class="tabs">
    <a href="../" class="tab"><img src="../icons/home.svg" alt="" width="24" height="24"><b data-km="ទំព័រដើម" data-en="Home">ទំព័រដើម</b></a>
    <a href="#/today" class="tab" data-r="home"><span aria-hidden="true">🚛<i id="liveCount" class="count" hidden></i></span><b data-km="ថ្ងៃនេះ" data-en="Today">ថ្ងៃនេះ</b></a>
    <a href="#/log" class="tab" data-r="log"><span aria-hidden="true">📋</span><b data-km="កំណត់ត្រា" data-en="Log">កំណត់ត្រា</b></a>
    <a href="#/sum" class="tab" data-r="sum"><span aria-hidden="true">📊</span><b data-km="សង្ខេប" data-en="Summary">សង្ខេប</b></a>
    <a href="#/plan" class="tab" data-r="plan" id="planTab" hidden><span aria-hidden="true">📑</span><b data-km="ផែនការ" data-en="Plan">ផែនការ</b></a>
  </nav>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js?v=20261028h"></script>
  <script src="../lang.js"></script>
  <script src="ib.js?v=20261028h"></script>
</body>
</html>
