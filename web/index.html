<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#011e41">
  <title>STEEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@800&text=STEEL&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/app-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="home.css?v=20261028b">
  <link rel="stylesheet" href="ads.css?v=20261031a">
  <script>try { var t = localStorage.getItem('fr_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <!-- Tapping the ISI STEEL logo refreshes the screen (Kim, 12 Oct 2026). -->
  <style>.isi-logo{cursor:pointer;-webkit-tap-highlight-color:transparent}</style>
  <script>document.addEventListener('click', function (e) { var l = e.target && e.target.closest && e.target.closest('.isi-logo'); if (!l) return; e.preventDefault(); if (window.ISTEEL_REFRESH) window.ISTEEL_REFRESH(); else location.reload(); });</script>
</head>
<body>
  <header class="bar" id="bar">
    <div class="brand">
      <div class="logo-col">
        <div class="isi-logo"><img src="icons/isi-white.png" alt="ISI" width="30" height="30"><span class="word">STEEL</span></div>
        <small class="net" id="net" hidden></small>
      </div>
    </div>
    <div class="bar-right">
      <span class="who" id="who" hidden></span>
      <button type="button" class="icon-btn lang-btn" id="langBtn"></button>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Light / Dark" title="Light / Dark">🌙</button>
      <button type="button" class="icon-btn" id="outBtn" aria-label="ចាកចេញ" title="ចាកចេញ" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="install" id="install" hidden></div>
  <main id="view"><div class="spinner"></div></main>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="lang.js"></script>
  <script src="request.js?v=20261031e"></script>
  <script src="live.js?v=20261030L"></script>
  <script src="ads.js?v=20261031a" data-app="home"></script>
  <script src="home.js?v=20261031e"></script>
</body>
</html>
