<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#011e41">
  <title>ការរាប់ស្តុក · Stock Count</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@800&text=STEEL&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link rel="apple-touch-icon" href="../icons/app-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="sc.css?v=20261113h">
  <script>try { var t = localStorage.getItem('fr_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <!-- Tapping the ISI STEEL logo refreshes the screen. -->
  <style>.isi-logo{cursor:pointer;-webkit-tap-highlight-color:transparent}</style>
  <script>document.addEventListener('click', function (e) { var l = e.target && e.target.closest && e.target.closest('.isi-logo'); if (!l) return; e.preventDefault(); if (window.SC_REFRESH) window.SC_REFRESH(); else location.reload(); });</script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <div class="isi-logo"><img src="../icons/isi-white.png" alt="ISI" width="30" height="30"><span class="word">STEEL</span></div>
      <span class="sep" aria-hidden="true"></span>
      <div><b data-km="ការរាប់ស្តុក" data-en="Stock Count">ការរាប់ស្តុក</b><small data-km="កាតស្តុកឌីជីថល" data-en="Digital stock card">កាតស្តុកឌីជីថល</small></div>
    </div>
    <div class="bar-right">
      <a class="icon-btn" href="../" aria-label="Home" title="Home">🏠</a>
      <button type="button" class="icon-btn lang-btn" id="langBtn"></button>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Light / Dark" title="Light / Dark">🌙</button>
    </div>
  </header>
  <div id="demo" class="demo" hidden></div>
  <main id="view"><div class="loading" role="status"><div class="skel"></div><div class="skel"></div><div class="skel short"></div></div></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js?v=20261113a"></script>
  <script src="../live.js?v=20261113b"></script>
  <script src="../lang.js"></script>
  <script src="sc.js?v=20261113k"></script>
</body>
</html>
